[project]
name = "kivi-memory"
version = "0.1.0"
description = "Semantic memory for Kivi - episodes, curated memories, and Hey Kivi."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "rich>=13.9",
    "numpy>=2.0",
    "sqlite-vec>=0.1.6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.20",
    "streamlit>=1.40",
]

[project.scripts]
kivi = "kivi.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kivi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
